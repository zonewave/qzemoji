[project]
name = "qzone-emoji-crawler"
version = "0.1.0"
description = "Resumable crawler for Qzone emoji GIFs"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiohttp>=3.13.3",
    "peewee>=4.4.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.1", "ruff>=0.12"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["."]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"

[tool.ruff]
line-length = 99
target-version = "py314"
